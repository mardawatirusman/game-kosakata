Math.random()<.5?{t:'tf',sec,q:`Benar/salah? "${C[0]}" artinya "${C[2]}"`,a:true,h:'Ikon: '+C[3]}:{t:'tf',sec,q:`Benar/salah? "${C[0]}" artinya "${D[2]}"`,a:false,h:'Ikon: '+C[3]}]}
function stage4(){scr(`<div class=card><b>🧩 Pengolahan Data</b><p>Pilih tempat untuk memainkan 4 tantangan!</p>${map(p=>'⭐'.repeat(S.bos[p.id]||0)||'🎮')}${P.every(p=>S.bos[p.id])?'<button onclick="stage5()">🏆 Tantangan Besar ➜</button>':''}</div>`)}
function pick4(id){const p=PL(id);quiz(qPlace(p),{done:(s,pc,t,b)=>{let ex='';if(s){S.bos[id]=Math.max(S.bos[id]||0,s);S.xp+=20;if(!S.bd.includes(p.b)){S.bd.push(p.b);ex=`<p>🏅 Lencana baru: <b>${p.b}</b></p>`}}const all=P.every(x=>S.bos[x.id]);if(all)setSt(5);save();res(lbl(p),s,pc,t,b,ex,all?'stage5()':'stage4()',`pick4('${id}')`)}})}
function stage5(){setSt(5);scr(`<div class=card><b>✅ Pembuktian – Tantangan Besar</b><p>10 soal: Buktikan kemampuanmu!</p><button onclick="g5()">🏁 Mulai</button></div>`)}
function g5(){const mc=(sec,q,a,o,h)=>({t:'mc',sec,q,a,o:shuf(o),h}),L=shuf(ALL).slice(0,5).map(c=>mc('Kuis Kosakata',`Apa arti "${c[0]}"? ${c[3]}`,c[2],[c[2],...shuf(ALL.filter(x=>x!=c)).slice(0,2).map(x=>x[2])],'Dibaca: '+c[1]));
const st=(q,a,o,h)=>mc('Cerita Sipayo','Pilih kata yang tepat: "'+q+'"',a,o,h);
L.push(st('Siti goes to the ____ with her mother.','market',['market','mosque','park'],'Tempat membeli ikan'),st('The fish is ____ and the price is cheap.','fresh',['fresh','quiet','holy'],'Artinya segar'),st('Then they ____ at the mosque.','pray',['pray','play','read'],'Artinya berdoa'));
[['WELCOME TO SIPAYO VILLAGE','Selamat datang di Desa Sipayo',['Selamat tinggal dari Desa Sipayo','Jalan menuju Desa Sipayo']],['KEEP THE PARK CLEAN','Jagalah taman tetap bersih',['Jangan bermain di taman','Taman dibuka hari ini']]].forEach(s=>L.push(mc('Terjemahkan Papan','Papan tertulis: «'+s[0]+'». Apa artinya?',s[1],[s[1],...s[2]],'Cari kata kunci: '+s[0].split(' ')[0].toLowerCase())));
quiz(L,{done:(s,pc,t,b)=>{if(s){S.fin=Math.max(S.fin,s);S.xp+=50;setSt(6)}res('Rapor Tantangan Besar 📝',s,pc,t,b,`<p>👤 ${esc(S.name)} · XP ${S.xp} · ⭐ ${tot()}</p>`,'stage6()','g5()')}})}
function quiz(list,o){QZ={list,i:0,ok:0,combo:0,t0:Date.now(),o,history:[]};qs()}
function qs(){const z=QZ;if(z.i>=z.list.length)return qe();const q=z.list[z.i];z.ans=0;z.hu=0;z.tr=0;let b='';
if(q.t=='mc')b=q.o.map((x,k)=>`<button class=opt onclick="ans(${k})">${esc(x)}</button>`).join('');
else if(q.t=='tf')b='<button class=opt onclick="ans(true)">✔️ Benar</button><button class=opt onclick="ans(false)">✖️ Salah</button>';
else{z.pool=q.tiles.map(x=>({x}));z.sel=[];b='<div id=sel class=tl></div><div id=pool class=tl></div><button onclick="chk()">✔ Periksa</button>'}
scr(`<div class=card><div class=row><small>${q.sec||''} · Soal ${z.i+1}/${z.list.length}</small><b id=tmr>⏱ 0 dtk</b></div>${z.combo>=3?'<b>🔥 Combo! Poin 2x</b>':''}<p><b>${esc(q.q)}</b></p>${b}<div id=fb></div><button class=alt onclick="hint()">💡 Petunjuk (-5 XP)</button></div>`);
if(q.t=='tl')dt();tm=setInterval(()=>{const e=$('tmr');if(e)e.textContent='⏱ '+((Date.now()-z.t0)/1000|0)+' dtk'},500)}
function dt(){const z=QZ;$('sel').innerHTML=z.sel.map((t,i)=>`<button class=tile onclick="un(${i})">${esc(t.x)}</button>`).join('')||'<small>Ketuk kotak di bawah…</small>';$('pool').innerHTML=z.pool.map((t,i)=>`<button class=tile onclick="pk(${i})">${esc(t.x)}</button>`).join('')}
function pk(i){if(QZ.ans)return;QZ.sel.push(QZ.pool.splice(i,1)[0]);dt()}
function un(i){if(QZ.ans)return;QZ.pool.push(QZ.sel.splice(i,1)[0]);dt()}
function chk(){const z=QZ,q=z.list[z.i];if(z.ans)return;const c=z.sel.map(t=>t.x).join(q.sep)===q.ans;if(!c&&!z.tr){z.tr=1;$('fb').innerHTML='<p>🤔 Hampir! Periksa urutannya, lalu coba lagi.</p>';return}mk(c,q.ans)}
function ans(v){const z=QZ,q=z.list[z.i];if(z.ans)return;const c=q.t=='mc'?q.o[v]===q.a:v===q.a;if(!c&&q.t=='mc'&&!z.tr){z.tr=1;document.querySelectorAll('#app .opt')[v].disabled=true;$('fb').innerHTML='<p>🤔 Belum tepat. Coba lagi, ya! Kamu pasti bisa!</p>';return}mk(c,q.t=='tf'?(q.a?'Benar':'Salah'):q.a)}
function mk(c,t){const z=QZ,q=z.list[z.i];z.ans=1;let m;
z.history.push(`Soal: ${q.q} | Jawab: ${c ? 'Benar' : 'Salah (Kunci: '+t+')'}`);
if(c){const g=z.tr?5:10*(z.combo>=3?2:1);z.ok+=z.tr?.5:1;z.combo=z.tr?0:z.combo+1;S.xp+=g;sOk();m=`✅ Benar! +${g} XP`}else{z.combo=0;sNo();m=`❌ Belum tepat. Jawaban: <b>${esc(t)}</b>`}
document.querySelectorAll('#app .opt,#app .tile').forEach(b=>b.disabled=true);$('fb').innerHTML=`<p>${m}</p><button class=alt onclick="nx()">Lanjut ➜</button>`;hd();save()}
function nx(){QZ.i++;qs()}
function hint(){const z=QZ,q=z.list[z.i];if(z.ans||z.hu)return;S.xp=Math.max(0,S.xp-5);z.hu=1;hd();$('fb').innerHTML='<p>💡 '+esc(q.h)+'</p>'}
function qe(){
    clearInterval(tm);
    const z=QZ,n=z.list.length,pc=z.ok/n,t=(Date.now()-z.t0)/1000|0;
    let s=pc>=.9?3:pc>=.7?2:pc>=.5?1:0,b=0;
    if(s&&s<3&&t<n*15){s++;b=1}
    save();

    // PENGIRIMAN DATA KE GOOGLE APPS SCRIPT
    if(GAS_URL !== "URL_GAS_ANDA_DISINI") {
        fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors', // Mencegah blokir CORS dari browser saat GAS me-redirect
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({
                nama: S.name,
                kelas: S.kelas || "-",
                benar: Math.floor(z.ok),
                salah: Math.ceil(n - z.ok),
                detail: z.history.join("\n")
            })
        }).catch(e => console.log('Silently ignoring fetch error:', e));
    }

    z.o.done(s,Math.round(pc*100),t,b);
}
function res(title,s,pc,t,b,ex,next,retry){s?sWin():sNo();save();scr(`<div class=card style="text-align:center"><div class=burst>${s?'🎉✨🎉':''}</div><h2>${title}</h2><div class=stars>${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p>Nilai: <b>${pc}%</b> · Waktu ${t} dtk${b?' · ⚡ Bonus cepat!':''}</p><p>${['Jangan menyerah! Ayo coba lagi, kamu pasti bisa!','Lumayan! Terus berlatih ya!','Bagus! Sedikit lagi sempurna!','Hebat sekali! Luar biasa!'][s]}</p>${ex||''}${s?`<button class=alt onclick="${next}">Lanjut ➜</button>`:''}<button onclick="${retry}">🔄 Ulangi</button></div>`)}
function hero(){if(S.fin==3&&P.every(p=>S.bos[p.id]==3)&&!S.bd.includes('🏆 Sipayo Hero'))S.bd.push('🏆 Sipayo Hero')}
const wh=()=>S.words.map(e=>{const w=ALL.find(x=>x[0]==e);return `<span class=chip>${w[3]} ${w[0]} = ${w[2]}</span>`}).join('')||'<small>Belum ada kata.</small>';
function stage6(){setSt(6);hero();if(!S.lbd){S.lbd=1;addLb()}save();scr(`<div class=card><div class=row style="justify-content:center">${kid(1)}</div><p class=bub>🧕 Siti: "Sekarang aku tahu! Di sekitar kita banyak kata bahasa Inggris!"</p><b>📖 Buku Kosakata (${S.words.length} kata)</b><div>${wh()}</div><p>🏅 ${S.bd.join(' · ')||'-'}</p><p>✍️ Tuliskan 3 kata bahasa Inggris yang kamu lihat di sekitar rumahmu!</p><textarea rows=3 style="width:100%;font:inherit"></textarea><br><button onclick="cert()">🎓 Sertifikat</button><button class=alt onclick="board()">🏆 Papan Skor</button><button class=alt onclick="start()">🏠 Layar Awal</button></div>`)}
function cert(){scr(`<div class="card cert"><h1>🎓 SERTIFIKAT</h1><p>diberikan kepada</p><h2>${esc(S.name)}</h2><p>karena telah menyelesaikan <b>Petualangan Kata di Sipayo</b><br>Bahasa Inggris Kelas IV · MIS Al-Khairaat Paguat</p><p>⭐ ${tot()} bintang · 📖 ${S.words.length} kata · XP ${S.xp}</p><p>${S.bd.join(' ')}</p><small>${new Date().toLocaleDateString('id-ID')}</small></div><button onclick="print()">🖨️ Cetak</button><button class=alt onclick="stage6()">⬅ Kembali</button>`)}
function book(){md(`<h3>📖 Buku Kosakata (${S.words.length}/${ALL.length})</h3>${wh()}<p style="text-align:center"><button onclick="cl()">Tutup</button></p>`)}
function help(){md(`<h3>❓ Bantuan</h3><p>${HT[S.st-1]}</p><p style="text-align:center"><button onclick="cl()">Mengerti</button></p>`)}
function board(){const l=lb();md(`<h3>🏆 Papan Skor</h3>${l.length?l.map((r,i)=>`${i+1}. ${esc(r.n)} – ${r.x} XP`).join('<br>'):'Belum ada skor.'}<p style="text-align:center"><button onclick="cl()">Tutup</button></p>`)}
function menu(){md(`<h3 style="text-align:center">⏸ Menu</h3><p style="text-align:center"><button onclick="cl()">▶ Lanjut</button><button class=alt onclick="sound=!sound;menu()">${sound?'🔊 Efek: On':'🔇 Efek: Off'}</button><button class=alt onclick="musicOn=!musicOn;if(musicOn){startMusic()}else{stopMusic()}menu()">${musicOn?'🎵 Musik: On':'🎵 Musik: Off'}</button><button class=alt onclick="cl();start()">🏠 Layar Awal</button></p>`)}
function guru(){md(`<h3>📋 Petunjuk Guru</h3><p>Data hasil kuis siswa kini otomatis tersimpan di Google Sheets yang terhubung melalui Google Apps Script.</p><p style="text-align:center"><button onclick="cl()">Tutup</button></p>`)}
const boatMsgs = ["Keep up the good work!", "English is fun!", "You are doing great!", "Let's learn new words!", "Have a nice day!"];
const bMsgEl = $('boat-msg');
if(bMsgEl){$('boat-container').addEventListener('animationiteration', () => {bMsgEl.innerText = boatMsgs[Math.floor(Math.random() * boatMsgs.length)];});}
start();
</script></body></html>
